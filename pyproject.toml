[project]
name = "geoembeddings"
version = "0.5.0"
description = "Unified simulation, representation training, and evaluation for GeoEmbeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6.0,<7",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
viz = [
  "folium>=0.20,<0.21",
  "jupyter>=1.1,<2",
  "matplotlib>=3.10,<4",
  "seaborn>=0.13,<0.14",
]

[project.scripts]
geoembed = "geoembeddings.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoembeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
