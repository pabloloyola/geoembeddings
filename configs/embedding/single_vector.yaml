seed: 20260806

data:
  max_sequence_length: 64
  min_history_events: 2
  train_fraction: 0.70
  validation_fraction: 0.15
  include_object_id: false
  categorical_fields:
    - service_id
    - action_type
    - observation_mode
    - object_category
    - region_id
    - geohash_5
    - geohash_7
  continuous_fields:
    - latitude
    - longitude
    - log_delta_minutes
    - hour_sin
    - hour_cos
    - dow_sin
    - dow_cos
    - log_location_accuracy_m

model:
  categorical_embedding_dim: 24
  event_dim: 128
  hidden_dim: 128
  user_embedding_dim: 128
  gru_layers: 1
  dropout: 0.10
  event_dropout: 0.10

objectives:
  next_service: 0.20
  next_action: 0.40
  next_category: 1.00
  next_region: 0.75
  next_geohash_5: 0.50
  next_geohash_7: 0.25
  cross_window_consistency: 0.10

training:
  batch_size: 128
  epochs: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  num_workers: 0
  device: auto

evaluation:
  probe_train_fraction: 0.80
  ridge_alpha: 10.0
  event_removal:
    algorithm_version: sha256-event-removal/1.0
    seed: 20260811
    rates: [0.0, 0.1, 0.25, 0.5]
  robustness:
    schema_version: robustness-spec/1.0
    algorithm_version: sha256-robustness-views/2.0
    seed: 20260811
    views:
      gps:
        - {sigma_m: 25.0}
        - {sigma_m: 100.0}
      timestamp:
        - {max_jitter_seconds: 300.0}
        - {max_jitter_seconds: 1800.0}
      leave-one-service-out:
        - {service_id: location}
        - {service_id: local_commerce}
        - {service_id: ecommerce}
        - {service_id: travel}
      recent-truncation:
        - {remove_recent_events: 1}
        - {remove_recent_events: 8}
  episode_response:
    # Half-open, boundary-relative hours: [left, right).  These edges are part
    # of the comparison contract and must match across representations.
    boundary_bin_edges_hours: [-24, -12, -6, -3, -1, 0, 1, 3, 6, 12, 24]
